<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Org Zhixing</title>
    <link rel="preload" as="fetch" href="./org-zhixing.static.json" crossorigin />
    <link rel="preload" as="fetch" href="./org-zhixing.toml" crossorigin />
  </head>
  <body>
    <div id="app">
      <div
        data-initial-app-shell
        role="status"
        aria-live="polite"
        aria-label="Loading selected theme"
        style="
          min-height: 100svh;
          display: grid;
          place-items: center;
          padding: 1rem;
          font:
            500 0.75rem/1.25 system-ui,
            sans-serif;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          color: CanvasText;
          background: Canvas;
          color-scheme: light dark;
        "
      >
        <span style="opacity: 0.55">Loading theme…</span>
      </div>
    </div>
  </body>
</html>
